# HelpCentre Pro — monolith Blueprint
# One backend API + two static frontends + Postgres.

services:
  # ── Single backend (all /api/v1 routes)
  - type: web
    name: helpcentre-pro-api
    runtime: node
    plan: free
    rootDir: FUMS-HELP-CENTER-PRO-main/FUMS-HELP-CENTER-PRO-main
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && node server.js
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: monolith
      - key: POSTGRES_REQUIRED
        value: "true"
      - key: MONGODB_REQUIRED
        value: "false"
      - key: REDIS_REQUIRED
        value: "false"
      - key: USE_NOTIFICATION_SERVICE
        value: "false"
      - key: SEED_TEST_USER
        value: "false"
      - key: PURGE_DEMO_DATA
        value: "false"
      - key: SEED_PROVIDER_SUPER_ADMIN
        value: "true"
      - key: EMAIL_ENABLED
        value: "true"
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://helpcentre-pro-web.onrender.com
      - key: ADMIN_FRONTEND_URL
        value: https://helpcentre-pro-admin.onrender.com
      - key: CORS_ORIGINS
        value: https://helpcentre-pro-web.onrender.com,https://helpcentre-pro-admin.onrender.com
      # Optional WebRTC gateway for SIP carriers that publish only IP + UDP 5060
      # (Stuncall et al.). Set it in the Render dashboard to a Kamailio /
      # FreeSWITCH / Asterisk `transport ws` endpoint — e.g.
      # wss://sip.your-domain.com:8089/ws — and agents never need a WSS URL.
      - key: SIP_DEFAULT_WSS
        sync: false
      - key: DATABASE_URL_PRODUCTION
        fromDatabase:
          name: helpcentre-pro-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL_FROM
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

  # ── Tenant frontend
  - type: web
    name: helpcentre-pro-web
    runtime: static
    rootDir: help-centre-pro-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_NAME
        value: HelpCentre Pro
      - key: VITE_PORTAL_MODE
        value: tenant
      - key: VITE_API_URL
        value: https://helpcentre-pro-api.onrender.com
      - key: VITE_ADMIN_URL
        value: https://helpcentre-pro-admin.onrender.com
      # Optional platform WebRTC gateway (see SIP_DEFAULT_WSS on the API).
      - key: VITE_SIP_DEFAULT_WSS
        sync: false

  # ── Admin frontend
  - type: web
    name: helpcentre-pro-admin
    runtime: static
    rootDir: help-centre-pro-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_NAME
        value: HelpCentre Pro Admin
      - key: VITE_PORTAL_MODE
        value: admin
      - key: VITE_API_URL
        value: https://helpcentre-pro-api.onrender.com
      - key: VITE_APP_URL
        value: https://helpcentre-pro-web.onrender.com
      # Optional platform WebRTC gateway (see SIP_DEFAULT_WSS on the API).
      - key: VITE_SIP_DEFAULT_WSS
        sync: false

databases:
  - name: helpcentre-pro-db
    plan: free
    databaseName: help_center_pro
    user: helpcentre
