# HelpCentre Pro — one-click Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# After connecting GitHub (ebubeprimex), click "New +" → "Blueprint"
# and select this repo. Render creates Postgres + API + Tenant app + Admin app.

services:
  - type: web
    name: helpcentre-pro-api
    runtime: node
    plan: free
    rootDir: FUMS-HELP-CENTER-PRO-main/FUMS-HELP-CENTER-PRO-main
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4008"
      - key: POSTGRES_REQUIRED
        value: "true"
      - key: MONGODB_REQUIRED
        value: "false"
      - key: REDIS_REQUIRED
        value: "false"
      - key: SEED_TEST_USER
        value: "false"
      - key: SEED_PROVIDER_SUPER_ADMIN
        value: "true"
      - key: EMAIL_ENABLED
        value: "true"
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL_PRODUCTION
        fromDatabase:
          name: helpcentre-pro-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL_FROM
        sync: false

  # Tenant / workspace app
  - type: web
    name: helpcentre-pro-web
    runtime: static
    rootDir: help-centre-pro-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_NAME
        value: HelpCentre Pro
      - key: VITE_PORTAL_MODE
        value: tenant
      - key: VITE_API_URL
        sync: false
      - key: VITE_ADMIN_URL
        sync: false

  # Dedicated Admin Portal (different URL from the tenant app)
  - type: web
    name: helpcentre-pro-admin
    runtime: static
    rootDir: help-centre-pro-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_NAME
        value: HelpCentre Pro Admin
      - key: VITE_PORTAL_MODE
        value: admin
      - key: VITE_API_URL
        sync: false
      - key: VITE_APP_URL
        sync: false

databases:
  - name: helpcentre-pro-db
    plan: free
    databaseName: help_center_pro
    user: helpcentre
