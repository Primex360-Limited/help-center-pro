# Help Centre Pro — microservice stack.
#
# One-click: double-click Start-Help-Centre-Pro.bat
# Or:        docker compose up --build
#
# Gateway   : http://localhost:4008   (Swagger at /api-docs)
# Frontend  : http://localhost:5173
#
# Domain services (internal):
#   auth 4010 | tenant 4011 | identity 4012 | tickets 4013 | notification 4014
name: help-center-pro

x-backend-env: &backend-env
  NODE_ENV: development
  FRONTEND_URL: http://localhost:5173
  DATABASE_URL_PRODUCTION: postgresql://postgres:password@postgres:5432/help_center_pro?schema=public
  POSTGRES_REQUIRED: "true"
  JWT_ACCESS_SECRET: help_center_pro_dev_access_secret_change_me_32chars
  JWT_REFRESH_SECRET: help_center_pro_dev_refresh_secret_change_me_32chars
  JWT_ACCESS_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  REDIS_URL: redis://redis:6379
  REDIS_REQUIRED: "false"
  MONGODB_REQUIRED: "false"
  FLEXIBLE_USER_MANAGEMENT: ""
  SEED_TEST_USER: "true"
  INTERNAL_SERVICE_KEY: help_center_pro_internal_dev_key_change_me
  AUTH_SERVICE_URL: http://auth-service:4010
  TENANT_SERVICE_URL: http://tenant-service:4011
  IDENTITY_SERVICE_URL: http://identity-service:4012
  TICKETS_SERVICE_URL: http://tickets-service:4013
  NOTIFICATION_SERVICE_URL: http://notification-service:4014
  USE_NOTIFICATION_SERVICE: "true"

x-backend-build: &backend-build
  build:
    context: ./FUMS-HELP-CENTER-PRO-main/FUMS-HELP-CENTER-PRO-main
  env_file:
    - ./FUMS-HELP-CENTER-PRO-main/FUMS-HELP-CENTER-PRO-main/.env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ./FUMS-HELP-CENTER-PRO-main/FUMS-HELP-CENTER-PRO-main/src:/app/src
    - ./FUMS-HELP-CENTER-PRO-main/FUMS-HELP-CENTER-PRO-main/services:/app/services
    - ./FUMS-HELP-CENTER-PRO-main/FUMS-HELP-CENTER-PRO-main/package.json:/app/package.json

services:
  postgres:
    image: postgres:16
    container_name: hcp-postgres
    environment:
      POSTGRES_DB: help_center_pro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - hcp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d help_center_pro"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: hcp-redis
    volumes:
      - hcp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  notification-service:
    <<: *backend-build
    container_name: hcp-notification
    environment:
      <<: *backend-env
      SERVICE_NAME: notification-service
      PORT: "4014"
    command: ["npx", "nodemon", "services/notification-service/server.js"]

  auth-service:
    <<: *backend-build
    container_name: hcp-auth
    environment:
      <<: *backend-env
      SERVICE_NAME: auth-service
      PORT: "4010"
    command: sh -c "npx prisma migrate deploy && npx nodemon services/auth-service/server.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification-service:
        condition: service_started

  tenant-service:
    <<: *backend-build
    container_name: hcp-tenant
    environment:
      <<: *backend-env
      SERVICE_NAME: tenant-service
      PORT: "4011"
    command: ["npx", "nodemon", "services/tenant-service/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started

  identity-service:
    <<: *backend-build
    container_name: hcp-identity
    environment:
      <<: *backend-env
      SERVICE_NAME: identity-service
      PORT: "4012"
    command: ["npx", "nodemon", "services/identity-service/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      notification-service:
        condition: service_started

  tickets-service:
    <<: *backend-build
    container_name: hcp-tickets
    environment:
      <<: *backend-env
      SERVICE_NAME: tickets-service
      PORT: "4013"
    command: ["npx", "nodemon", "services/tickets-service/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started

  gateway:
    <<: *backend-build
    container_name: hcp-gateway
    environment:
      <<: *backend-env
      SERVICE_NAME: gateway
      PORT: "4008"
    ports:
      - "4008:4008"
    command: ["npx", "nodemon", "services/gateway/server.js"]
    depends_on:
      auth-service:
        condition: service_started
      tenant-service:
        condition: service_started
      identity-service:
        condition: service_started
      tickets-service:
        condition: service_started
      notification-service:
        condition: service_started

  # Alias kept so existing docs / Start-*.bat that expect "backend" still work.
  backend:
    <<: *backend-build
    container_name: hcp-backend
    profiles: ["monolith"]
    environment:
      <<: *backend-env
      SERVICE_NAME: monolith
      PORT: "4008"
      USE_NOTIFICATION_SERVICE: "false"
      NOTIFICATION_SERVICE_URL: ""
    ports:
      - "4009:4008"
    command: sh -c "npx prisma migrate deploy && node server.js"

  frontend:
    build:
      context: ./help-centre-pro-frontend
    container_name: hcp-frontend
    depends_on:
      - gateway
    env_file:
      - ./help-centre-pro-frontend/.env
    environment:
      VITE_API_URL: http://localhost:4008
      VITE_APP_NAME: HelpCentre Pro
    ports:
      - "5173:5173"
    volumes:
      - ./help-centre-pro-frontend/src:/app/src
      - ./help-centre-pro-frontend/public:/app/public
      - ./help-centre-pro-frontend/index.html:/app/index.html
      - ./help-centre-pro-frontend/package.json:/app/package.json
      - ./help-centre-pro-frontend/package-lock.json:/app/package-lock.json
      - ./help-centre-pro-frontend/vite.config.js:/app/vite.config.js
      - ./help-centre-pro-frontend/.env:/app/.env
    command: sh -c "npm install && npm run dev"

volumes:
  hcp_pg_data:
  hcp_redis_data:
